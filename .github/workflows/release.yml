# Builds the installers, and publishes them only from the production branch.
#
# Those are two separate questions, and conflating them deadlocks a pull request.
#
# BUILDING runs on a pull request into production as well as on the push that merges
# it. Without that, the three packaging jobs can never report a status on the PR, so
# making them required branch-protection checks leaves the PR waiting forever for a
# workflow that cannot start until after the merge it is blocking.
#
# PUBLISHING runs only on a real push to production. It is enforced in three
# independent places, because "we only publish from production" is the kind of rule
# that holds until someone picks the wrong branch from a dropdown:
#
#   1. on.push.branches lists only production, so no other push starts this.
#   2. the `version` job refuses to run unless the ref is production or the pull
#      request targets it — workflow_dispatch lets you choose any branch, so trigger
#      filtering alone is not enough, and every other job needs `version`.
#   3. the `publish` job additionally requires event_name == 'push'. A pull request
#      therefore builds and verifies the packages and cannot release them, which is
#      the whole point: the PR proves it packages, the merge ships it.
#
# The version comes from project(MyNAS VERSION ...) in CMakeLists.txt. Releasing is
# therefore: bump that number, merge to production. There is no second place to edit
# and no way for the tag to disagree with the binary.

name: Release

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      # Three ways to be legitimately here, and nothing else. On a pull request
      # github.ref is refs/pull/N/merge, so the branch has to be read from
      # github.base_ref instead — comparing github.ref would reject every PR.
      - name: Refuse to run for anything but production
        if: >-
          !(
            (github.event_name == 'push' && github.ref == 'refs/heads/production') ||
            (github.event_name == 'pull_request' && github.base_ref == 'production') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production')
          )
        run: |
          echo "::error::This workflow is for the production branch only."
          echo "event=${{ github.event_name }} ref=${{ github.ref }} base=${{ github.base_ref }}"
          exit 1

      # fetch-depth: 0 for the tags and the history between them. The whole version
      # calculation is "what has been committed since the last release tag", and a
      # shallow clone has neither half of that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: read
        name: Work out the next version from the commit messages
        run: |
          # Nothing is read from a tracked file and nothing is written back. The
          # previous version is the last v* tag; the increment comes from the
          # Conventional Commits since it. See scripts/next-version.sh.
          version=$(sh scripts/next-version.sh --explain)

          if [ -z "$version" ]; then
            echo "::error::Could not work out the next version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous=$(git tag -l 'v*' --merged HEAD --sort=-v:refname | head -n 1)
          {
            echo "### Version"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Previous release | \`${previous:-none}\` |"
            echo "| This release | \`v${version}\` |"
            echo ""
            echo "Derived from the Conventional Commits since \`${previous:-the start}\`."
            echo "Nothing is committed back — the tag is the record."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Windows: NSIS installer, plus a portable zip ───────────────────────────
  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Make sure makensis is reachable
        shell: bash
        run: |
          # NSIS ships in the runner image but is not always on PATH, and CPack's
          # error for a missing makensis does not say that is what it wants.
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          command -v makensis || choco install nsis -y --no-progress

      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNESTDRIVE_VERSION="${VERSION}" \
            -DNESTDRIVE_BUILD_TESTS=OFF \
            -DNESTDRIVE_BUILD_BENCH=OFF
          cmake --build build --parallel

      # CPack runs the install rules, which run windeployqt, so the packaged tree
      # carries the Qt DLLs and plugin set chosen by the toolchain that built it.
      - name: Package
        shell: bash
        run: |
          cd build
          cpack -G "NSIS;ZIP"
          mkdir -p ../out
          cp NestDrive-${VERSION}-windows-x64.exe ../out/
          cp NestDrive-${VERSION}-windows-x64.zip ../out/
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: out/*
          retention-days: 7

  # ── macOS: a .dmg for Apple Silicon ───────────────────────────────────────
  macos:
    name: macOS disk image
    needs: version
    runs-on: macos-latest        # macos-latest is arm64, which is the target here.
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: clang_64
          modules: qtimageformats
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DNESTDRIVE_VERSION="${VERSION}" \
            -DNESTDRIVE_BUILD_TESTS=OFF \
            -DNESTDRIVE_BUILD_BENCH=OFF
          cmake --build build --parallel

      - name: Deploy the bundle
        run: cmake --install build --prefix "$PWD/dist"

      # This signature is not about trust — it is ad-hoc, so it proves nothing about
      # who built it. It is about the binary running at all: on Apple Silicon the
      # kernel refuses to execute an arm64 binary with no valid signature, and
      # macdeployqt has just rewritten every rpath in the bundle, which invalidates
      # whatever signature the linker left behind. Signing therefore has to come
      # after deployment, not before.
      #
      # Users will still see Gatekeeper's "unidentified developer" warning, because
      # that needs a paid Developer ID and notarisation. docs/CI-CD.md explains how
      # to open it anyway and what adding real signing would involve.
      - name: Sign ad-hoc and verify
        run: |
          codesign --force --deep --sign - dist/MyNAS.app
          codesign --verify --deep --strict --verbose=2 dist/MyNAS.app

      - name: Build the disk image
        run: |
          mkdir -p out staging
          cp -R dist/MyNAS.app staging/NestDrive.app

          # A symlink to /Applications is what makes the window users see on mount
          # into something they can drag into, rather than a folder they have to
          # know what to do with.
          ln -s /Applications staging/Applications

          hdiutil create \
            -volname "NestDrive ${VERSION}" \
            -srcfolder staging \
            -ov -format UDZO \
            "out/NestDrive-${VERSION}-macos-arm64.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: out/*
          retention-days: 7

  # ── Linux: one AppImage, no install step at all ────────────────────────────
  linux:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1 libfreetype6 file \
            libopenjp2-7 libheif1 xvfb

      - uses: lukka/get-cmake@latest

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNESTDRIVE_VERSION="${VERSION}" \
            -DNESTDRIVE_BUILD_TESTS=OFF \
            -DNESTDRIVE_BUILD_BENCH=OFF
          cmake --build build --parallel

      - name: Lay out the AppDir
        run: cmake --install build --prefix "$PWD/AppDir/usr"

      # Qt 6.10's prebuilt Linux binaries are built on Ubuntu 22.04, and its TIFF
      # image plugin links libtiff.so.5. ubuntu-latest is 24.04, which ships
      # libtiff.so.6 — a different soname, and libtiff5 is not packaged for 24.04 at
      # all, so there is nothing to install. linuxdeploy treats the missing
      # dependency as fatal and fails the whole run on it.
      #
      # Dropping the one plugin is the fix that does not depend on a runner label.
      # The alternatives are worse: pinning ubuntu-22.04 works today but fails
      # outright whenever GitHub retires the label, and faking libtiff.so.5 as a
      # symlink to .so.6 would load a plugin against an ABI it was not built for,
      # trading a build failure for a crash in front of a user.
      #
      # The cost is that TIFF photos get no thumbnail in the Linux AppImage. They
      # still list, download and play normally: ThumbnailCache already treats a
      # format Qt cannot read as simply not offered, which is the same path a machine
      # without ffmpeg takes for video. Noted in docs/CI-CD.md.
      # linuxdeploy's Qt plugin deploys every plugin in a module's directory, and
      # treats any plugin's missing dependency as fatal to the whole run. Qt ships
      # drivers for software that is not installed here and that this application
      # would never speak to, so those dependencies cannot be satisfied and should
      # not be.
      #
      # Removing the plugins is the fix rather than installing the libraries. An
      # earlier version of this step deleted only libqtiff.so, which was treating the
      # symptom: the next run failed on libqsqlmysql.so wanting libmysqlclient.so.21,
      # and behind that sit the PostgreSQL, ODBC, Oracle, Firebird and Mimer drivers
      # with the same problem each. Chasing them one per CI round is not a strategy.
      - name: Prune Qt plugins this application cannot use
        run: |
          plugins="$QT_ROOT_DIR/plugins"

          # ── SQL drivers: keep SQLite, drop the rest ───────────────────────────
          # Not a workaround. src/db/Database.cpp only ever calls
          # addDatabase("QSQLITE") and checks isDriverAvailable("QSQLITE"); there is
          # no code path to any other backend, so a MySQL or Oracle client library in
          # the package would be weight that can never be used.
          keep="libqsqlite.so"
          echo "── sqldrivers ──"
          for driver in "$plugins"/sqldrivers/*.so; do
            [ -e "$driver" ] || continue
            name=$(basename "$driver")
            if [ "$name" = "$keep" ]; then
              echo "  keeping $name"
            else
              echo "  removing $name"
              rm -f "$driver"
            fi
          done

          # ── TIFF: cannot be satisfied on this runner ──────────────────────────
          # Qt 6.10's Linux binaries are built on Ubuntu 22.04 and this plugin links
          # libtiff.so.5; ubuntu-latest is 24.04, which ships .so.6 and packages no
          # libtiff5 at all. Unlike the drivers above this one is a real loss — TIFF
          # photos get no thumbnail — so it is recorded in docs/CI-CD.md §6 rather
          # than treated as housekeeping.
          echo "── imageformats ──"
          if rm -f "$plugins/imageformats/libqtiff.so"; then
            echo "  removed libqtiff.so (needs libtiff.so.5)"
          fi

          # Printed so that the next missing dependency can be read against the set
          # that was actually offered for deployment, instead of being guessed at.
          echo "── remaining sqldrivers ──"
          ls "$plugins/sqldrivers" || true
          echo "── remaining imageformats ──"
          ls "$plugins/imageformats" || true

      - name: Build the AppImage
        env:
          # Deliberately no EXTRA_QT_MODULES. An earlier version set
          # EXTRA_QT_PLUGINS="sqldrivers;imageformats", which was wrong twice over:
          # the variable was renamed to EXTRA_QT_MODULES, and it takes Qt *module*
          # names rather than plugin directory names. It resolved to nothing and the
          # log said so — "Extra Qt modules:" followed by a blank.
          #
          # It was also unnecessary. The plugin reads the modules off the binary:
          # "Found Qt modules: core dbus gui network sql widgets". sqldrivers comes
          # with sql and imageformats with gui, so both were always being deployed.
          # Naming them again only created something to get wrong.

          # Runs the tools by unpacking them instead of mounting them. GitHub's
          # runners have no FUSE, so a type-2 AppImage cannot mount itself here —
          # this affects the build tools only, not the AppImage they produce.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # linuxdeploy's Qt plugin finds Qt through qmake, not through CMake.
          # Exported in the shell rather than in the env: block above, because
          # QT_ROOT_DIR is set by the previous step and reading it here is one less
          # thing that depends on when GitHub evaluates an expression.
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          "$QMAKE" -query QT_VERSION

          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          plugin=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous

          # Downloaded without the .AppImage suffix on purpose: the glob that picks
          # up the output below would otherwise match the tools as well.
          curl -fsSL -o linuxdeploy           "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$plugin/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"

          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/MyNAS \
            --desktop-file AppDir/usr/share/applications/nestdrive.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/nestdrive.svg \
            --plugin qt \
            --output appimage

          mkdir -p out
          mv ./*.AppImage "out/NestDrive-${VERSION}-linux-x86_64.AppImage"
          chmod +x out/*.AppImage
          ls -la out

      # Static checks on what was bundled. Cheap, and they fail for exactly one
      # reason, which is what makes them worth having next to the smoke test below.
      #
      # The SQLite driver is the one that matters most: without it the application
      # starts normally, Qt6::Sql loads with no driver, and the database silently
      # never opens — so thumbnails and accounts do not work and nothing says why.
      - name: Check the AppDir has its plugins
        run: |
          echo "── Qt plugins in the AppDir ──"
          find AppDir/usr/plugins -maxdepth 2 -type d | sort

          test -f AppDir/usr/plugins/platforms/libqxcb.so
          ls AppDir/usr/plugins/sqldrivers | grep -q sqlite
          ls AppDir/usr/plugins/imageformats | grep -q webp
          echo "Platform, SQLite and WebP plugins are all present."

      # The first time this application has ever been run on Linux by anything.
      #
      # Everything above proves the file was assembled; none of it proves the result
      # executes. A missing library or an unloadable plugin shows up here and nowhere
      # else, and the alternative place to discover it is on a stranger's machine.
      #
      # xvfb rather than QT_QPA_PLATFORM=offscreen on purpose: offscreen would skip
      # the xcb platform plugin, which is the single most likely thing to be missing
      # a dependency, and so would pass a build no real desktop could start.
      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          app="out/NestDrive-${VERSION}-linux-x86_64.AppImage"

          set +e
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            "$app" > smoke.log 2>&1 &
          pid=$!
          sleep 12

          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null
            status=0
            echo "✅ The AppImage started and was still running after 12 seconds."
          else
            wait "$pid"
            echo "❌ The AppImage exited on its own (code $?) instead of staying up."
            echo "   If the output below mentions the system tray or a platform"
            echo "   plugin, the cause is this bare X server rather than the package."
            status=1
          fi
          set -e

          echo "── application output ──"
          cat smoke.log || true

          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: out/*
          retention-days: 7

  # ── Publish ───────────────────────────────────────────────────────────────
  publish:
    name: Publish the release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest

    # A pull request builds the three packages and stops here. This is what keeps the
    # PR able to prove it packages without being able to release anything — the merge
    # is what ships. Also belt-and-braces against workflow_dispatch: that can be
    # pointed at a branch, and this only ever fires for a push to production.
    #
    # Do NOT make this a required status check. A skipped job reports as skipped
    # rather than success, so requiring it would reintroduce exactly the deadlock
    # this `if` exists to avoid.
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    # The only job in either workflow that can write to the repository, and it can
    # write exactly one thing: releases.
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # fetch-depth: 0 because the release notes are generated from `git log` between
      # tags, and the default shallow clone has neither the tags nor the history to
      # compare against — git describe would simply fail.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: out

      - name: Checksums
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'HEADER'
          ## Install

          | Platform | File | Notes |
          |---|---|---|
          | **Windows 10/11 (x64)** | `...-windows-x64.exe` | Installer. SmartScreen will warn — **More info → Run anyway**. |
          | **macOS (Apple Silicon)** | `...-macos-arm64.dmg` | Open, drag to Applications. First launch: **right-click → Open**. |
          | **Linux (x86_64)** | `...-linux-x86_64.AppImage` | `chmod +x` it and run. No install needed. |

          Both warnings are because the binaries are unsigned — see
          `docs/CI-CD.md` for what signing them would involve.

          Video features need `ffmpeg` on `PATH`; everything else works without it.
          Reaching your files from outside the house is set up in-app under
          **Remote access…** — see `docs/REMOTE-ACCESS.md`.

          ## Changes
          HEADER

          # Everything since the previous tag, so the notes are generated from what
          # was actually committed rather than from memory.
          #
          # Listed the same way scripts/next-version.sh picks its baseline, so the
          # notes cover exactly the commits the version was calculated from. The tag
          # for this release does not exist yet — `gh release create` makes it below —
          # so the newest tag here is still the previous release.
          previous=$(git tag -l 'v*' --merged HEAD --sort=-v:refname | head -n 1)

          if [ -n "$previous" ]; then
            git log --no-merges --pretty='- %s' "${previous}..HEAD" >> notes.md
          else
            echo "- First packaged release." >> notes.md
          fi

          cat notes.md

      - name: Create or update the release
        run: |
          tag="v${VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists — replacing its files."
            gh release upload "$tag" out/* --clobber
            gh release edit   "$tag" --notes-file notes.md
          else
            gh release create "$tag" out/* \
              --title "NestDrive $tag" \
              --notes-file notes.md
          fi

          gh release view "$tag"
