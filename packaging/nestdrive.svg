    <path d="M311.98 134.153C332 158.012 343.427 187.903 344.428 219.033C345.429 250.163 335.946 280.727 317.5 305.823V271.874C326.473 251.099 329.491 228.238 326.216 205.846C322.941 183.455 313.503 162.415 298.957 145.08L311.98 134.153Z" fill="#33D5FA"/>
    <path d="M99.0198 134.153C78.9996 158.012 67.5727 187.903 66.5718 219.033C65.5708 250.163 75.0539 280.727 93.5 305.823V271.874C84.5272 251.099 81.5094 228.238 84.784 205.846C88.0586 183.455 97.4965 162.415 112.043 145.08L99.0198 134.153Z" fill="#33D5FA"/>
