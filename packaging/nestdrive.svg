    <path d="M162.706 170.654C174.814 160.85 189.921 155.5 205.5 155.5C221.079 155.5 236.186 160.85 248.294 170.654L237.595 183.866C228.515 176.512 217.185 172.5 205.5 172.5C193.815 172.5 182.485 176.512 173.405 183.866L162.706 170.654Z" fill="#33D5FA"/>
