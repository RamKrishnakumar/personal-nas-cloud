<?xml version="1.0" encoding="UTF-8"?>
<!--
  NestDrive application icon.

  The artwork is unchanged from what was supplied. What changed is the canvas: the
  original was 411x426, and an application icon has to be square. Every converter
  that produces a .ico or .icns works from square raster sizes (16, 32, ... 1024), so
  a non-square source is either stretched — which bends the circular signal arcs into
  ellipses — or letterboxed with transparent bands down two sides.

  Squared by padding rather than by scaling: 411 becomes 426 with the art shifted
  7.5px right, so it sits centred and its proportions are untouched.

  The rounded rectangle is drawn as a filled shape rather than left as the original
  clip path. A clip hides what falls outside it but leaves the corners transparent
  only if something is painted there in the first place; drawing the background as a
  rect guarantees the fill reaches the full square. The radius is the original 87
  scaled to the new width (87/411 x 426 = 90) so the corners keep their original
  curvature.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="426" height="426" viewBox="0 0 426 426" fill="none">

  <!-- Full-bleed background. Opaque inside the rounded square, transparent outside,
       which is what macOS draws as-is in the Dock and what iOS needs in order not to
       render the transparency as black on a home screen. -->
  <rect width="426" height="426" rx="90" fill="#112137"/>

  <g transform="translate(7.5 0)">
    <path d="M157.75 302.75V215.5C157.75 209.167 160.583 206 166.25 206C168.75 206 171.333 207.333 174 210L236 274.5V206.25H252.75V293.5C252.75 299.833 249.833 303 244 303C241.333 303 238.667 301.667 236 299L174.5 235V302.75H157.75Z" fill="#F9F9FA"/>
