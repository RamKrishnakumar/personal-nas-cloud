    <path d="M110.702 121.842C136.436 97.8446 170.313 84.5 205.5 84.5C240.687 84.5 274.564 97.8446 300.298 121.842L288.704 134.275C266.117 113.213 236.383 101.5 205.5 101.5C174.617 101.5 144.883 113.213 122.296 134.275L110.702 121.842Z" fill="#33D5FA"/>
